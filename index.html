<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Val Rosa Resort | Cardápio</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
:root{--bg-color:#050505;--bg-surface:#0a0a0a;--gold:#D4AF37;--text-main:#fcfcfc;--text-muted:#9e9e9e;--border-gold:rgba(212,175,55,.3);--font-heading:'Gelasio',serif;--font-body:'Montserrat',sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg-color);color:var(--text-main);font-family:var(--font-body);line-height:1.6;overflow-x:hidden;scroll-behavior:smooth}
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:600}
.hidden{display:none!important}
.fade-in{animation:fadeIn .8s cubic-bezier(.4,0,.2,1) forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.bg-pattern{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(circle at 50% -20%,rgba(212,175,55,.08) 0%,transparent 60%);z-index:-1;pointer-events:none}
#hero{height:100vh;height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem}
.hero-logo{max-width:90%;width:380px;height:auto;margin-bottom:1rem;filter:drop-shadow(0 0 10px rgba(212,175,55,.3))}
.hero-subtitle{font-size:.95rem;color:var(--text-muted);letter-spacing:5px;margin-bottom:3rem;text-transform:uppercase;font-weight:300}
.hero-buttons{display:flex;flex-direction:column;gap:1.5rem;width:100%;max-width:340px}
.btn{background:rgba(5,5,5,.6);backdrop-filter:blur(5px);border:1px solid var(--border-gold);color:var(--gold);font-family:var(--font-heading);font-size:1.1rem;padding:1.2rem 2rem;cursor:pointer;touch-action:manipulation;transition:all .4s ease;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;letter-spacing:1px;border-radius:2px}
.btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(212,175,55,.1),transparent);transition:all .6s ease;z-index:1}
.btn:hover{background:var(--gold);color:var(--bg-color);border-color:var(--gold);box-shadow:0 5px 25px rgba(212,175,55,.2)}
.btn:hover::before{left:100%}
.btn i{font-size:1.2rem;z-index:2}.btn span{z-index:2}
#app-content{min-height:100vh;padding-bottom:120px}
.top-nav{position:sticky;top:0;background:rgba(5,5,5,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid var(--border-gold);padding:.8rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
.nav-brand{cursor:pointer;display:flex;align-items:center}
.nav-logo{height:48px;width:auto}
.tabs{display:flex;gap:1.5rem}
.tab-btn{background:none;border:none;color:var(--text-muted);font-family:var(--font-heading);font-size:1.05rem;cursor:pointer;padding:.5rem 0;position:relative;transition:color .3s ease;letter-spacing:1px}
.tab-btn.active{color:var(--gold)}
.tab-btn::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--gold);transition:width .3s ease}
.tab-btn.active::after{width:100%}
.menu-container{max-width:900px;margin:0 auto;padding:3rem 1.5rem}
.menu-section{margin-bottom:3.5rem}
.section-title{color:var(--gold);font-size:1.6rem;text-align:center;margin-bottom:2.5rem;text-transform:uppercase;letter-spacing:3px;display:flex;align-items:center;justify-content:center;gap:15px}
.section-title::before,.section-title::after{content:'';height:1px;width:50px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
.menu-item{margin-bottom:1.8rem;break-inside:avoid}
.item-header{display:flex;align-items:baseline;width:100%;margin-bottom:.4rem}
.item-name{font-family:var(--font-heading);font-size:1.15rem;letter-spacing:.5px;white-space:nowrap}
.item-dots{flex-grow:1;border-bottom:2px dotted rgba(212,175,55,.25);margin:0 12px;position:relative;top:-4px}
.item-price{font-size:1.1rem;color:var(--gold);font-weight:500;white-space:nowrap;letter-spacing:.5px}
.item-desc{font-size:.85rem;color:var(--text-muted);line-height:1.5;max-width:85%;font-weight:300}
.fab{position:fixed;bottom:30px;right:30px;background:var(--bg-surface);border:1px solid var(--border-gold);color:var(--gold);width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.8);transition:all .3s cubic-bezier(.4,0,.2,1);z-index:1000;text-decoration:none}
.fab:hover{background:var(--gold);color:var(--bg-color);transform:translateY(-5px);box-shadow:0 8px 30px rgba(212,175,55,.25)}
.fab-text{position:absolute;right:75px;background:rgba(10,10,10,.95);color:var(--gold);padding:10px 18px;border-radius:4px;border:1px solid var(--border-gold);font-size:.9rem;white-space:nowrap;opacity:0;pointer-events:none;transition:all .3s ease;font-family:var(--font-heading);letter-spacing:1px;transform:translateX(10px)}
.fab:hover .fab-text{opacity:1;transform:none}
@media(min-width:768px){.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 4rem;align-items:start}.hero-logo{width:520px}.hero-subtitle{font-size:1.1rem}}
@media(max-width:480px){.hero-logo{width:300px}.item-name{font-size:1.05rem;white-space:normal}.item-dots{display:none}.item-header{justify-content:space-between}.item-price{font-size:1rem;margin-left:10px}.fab{bottom:20px;right:20px;width:55px;height:55px;font-size:1.5rem}.section-title{font-size:1.3rem;letter-spacing:2px}.section-title::before,.section-title::after{width:30px}.top-nav{padding:.7rem 1rem}.nav-logo{height:40px}.tabs{gap:1rem}}

    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <section id="hero">
        <div class="fade-in">
            <img src="logo.png" alt="Villa Rosa Resort Logo" class="hero-logo">
            <p class="hero-subtitle">Menu Digital</p>
            <div class="hero-buttons">
                <button type="button" class="btn" onclick="openApp('comidas')"><i class="fa-solid fa-utensils"></i> <span>Ver Menu de Comidas</span></button>
                <button type="button" class="btn" onclick="openApp('bebidas')"><i class="fa-solid fa-wine-glass-empty"></i> <span>Ver Carta de Bebidas</span></button>
            </div>
        </div>
    </section>
    <section id="app-content" class="hidden">
        <header class="top-nav">
            <div class="nav-brand" onclick="goHome()"><img src="logo.png" alt="Villa Rosa" class="nav-logo"></div>
            <div class="tabs">
                <button class="tab-btn active" id="tab-comidas" onclick="switchTab('comidas')">Comidas</button>
                <button class="tab-btn" id="tab-bebidas" onclick="switchTab('bebidas')">Bebidas</button>
            </div>
        </header>
        <div id="view-comidas" class="menu-container fade-in">
            <div class="menu-grid" id="menu-comidas"></div>
        </div>
        <!-- ABA: BEBIDAS -->
        <div id="view-bebidas" class="menu-container hidden">
            <div class="menu-grid" id="menu-bebidas"></div>
        </div>    </section>

    <!-- Botão Fixo de Contato -->
    <a href="https://wa.me/244936872009" target="_blank" class="fab">
        <span class="fab-text">Chamar Garçom</span>
        <i class="fa-brands fa-whatsapp"></i>
    </a>
    <script>
        const currentMenu = {
            comidas: [
                { title: 'Entradas', items: [
                    ['Caldo de Peixe',5000]
                ]},
                { title: 'Menu Peixe', items: [
                    ['Choco grelhado à moda Villa ValRosa',9970,'Legumes salteados com batata, banana e vinagrete.'],
                    ['Mufete na brasa',7980,'Feijão de óleo palma, mandioca, banana e vinagrete. Opções de peixe: chopa / carapau / bacalhau'],
                    ['Posta de corvina grelhada',7650,'Quitutes da terra e legumes salteados.'],
                    ['Filete de peixe',6890,'Arroz de feijão malandro']
                ]},
                { title: 'Menu Carne', items: [
                    ['Grelhada mista 4 Pax',25000,'Entrecosto, Entremeadas, Febras, Frango, Vazia, Linguiça e chouriço com molho da casa. Arroz, Feijão preto com banana e batata frita.'],
                    ['Picanha na brasa',14600,'Feijão preto, batata frita, farofa, couve mineira e vinagrete.'],
                    ['Bife com molho de pimentos',12000,'Bife de lombo, arroz, batata frita, molho de pimentos.'],
                    ['Espetada mista de carne',12000,'Carne de vitela, carne de porco, batata frita, tomate e cebola.'],
                    ['Bife da vazia à moda Villa ValRosa',9895,'Arroz de açafrão, batata chips, ovo estrelado, bacon e queijo.'],
                    ['Bife de frango na chapa',9000,'Peito de frango, arroz xau xau, batatas fritas e salada, molho de alho / molho de cogumelos e natas.'],
                    ['Frango churrasco',8960,'Arroz, batata frita, salada e molho vinagrete'],
                    ['Entrecosto na brasa',8960,'Arroz, feijão preto, batata frita, salada e molho vinagrete.'],
                    ['Bitoque',8000,'Arroz branco, batata frita, salada e molho vinagrete.'],
                    ['Entremeada na brasa',8960,'Arroz de feijão, batata frita salada'],
                    ['Peito alto',7850],
                    ['Massa com todos',7500,'Misto de carnes com todos'],
                    ['Galinha de Muamba',7500]
                ]},
                { title: 'Pizzas', items: [['Pizza de Carne Grande',9000],['Pizza de Frango Grande',8000],['Pizza de Carne Média',7000],['Pizza de Frango Média',6000]] },
                { title: 'Pratos', items: [['Prego no Prato',7000],['Bifana no Prato',6500]] },
                { title: 'Hambúrgueres', items: [['Hambúrguer de Carne',4000],['Hambúrguer de Frango',3000]] },
                { title: 'Faitas', items: [['Faita de Carne',4000],['Faita de Frango',3500]] },
                { title: 'Sobremesas', items: [['Bolo de pudim',2500],['Bolo de chocolate',2500]] }
            ],
            bebidas: [
                { title: 'Cervejas em garrafa', items: [['Heineken',1500],['Corona',1500],['Eka',600],['Cuca',600],['Nocal',600],['Doppel',600]] },
                { title: 'Cervejas em lata', items: [['Cuca',1000],['Eka',1000],['Nocal',1000],['Heineken',1000],['Doppel',1000]] },
                { title: 'Fino', items: [['Caneção (caneca)',1800],['Tulipa',800],['Normal',600],['Lambreta',400]] },
                { title: 'Cidras em garrafa', items: [['Savana',1500],['Hunters Gold',1500],['Booster Cidra',750],['Booster Morango',750],['Booster manga e laranja',750]] },
                { title: 'Refrigerantes em lata', items: [['Água Tónica',1200],['Ginger Ale',1200],['Sumol Laranja/Ananás',1000],['Coca Cola',1000],['Sprite',1000],['Fanta',1000]] },
                { title: 'Energético', items: [['Speed',1500]] },
                { title: 'Águas', items: [['Água Grande',1000],['Água Pequena',400]] },
                { title: 'Sumos', items: [['Maracujá',3000],['Ananás',3000],['Limonada',3000],['Compal',2500],['Nutry',2500],['Sumo Palinha',500]] },
                { title: 'Whiskies', items: [['Jameson Black (garrafa)',55000],['Jameson Black (dose)',5000],['Jameson (garrafa)',35000],['Jameson (dose)',3000]] },
                { title: 'Tequila', items: [['Tequila (garrafa)',20000],['Tequila (dose)',2000]] },
                { title: 'Gins', items: [['Beefeater (garrafa)',22000],['Beefeater (dose)',3000],['Gordon (garrafa)',18000],['Gordon (dose)',3000],['Beevock (garrafa)',16000],['Beevock (dose)',2000],['Havelock (garrafa)',16000],['Havelock (dose)',2000]] },
                { title: 'Licores', items: [['Martini Rosso',20000],['Martini (dose)',2500],['Amarula (garrafa)',16000],['Amarula (dose)',2000]] },
                { title: 'Outras bebidas', items: [['Gin Gordon original/Pink',1500],['Smirnoff Preta/Branca',1500]] },
                { title: 'Cocktails', items: [['Gin Tónico',4500],['Caipirinha',3000],['Maracujá',3000]] },
                { title: 'Vinhos', items: [['Silk Space',18000],['Fazenda Velha',12000],['Valmont',1500]] },
                { title: 'Vinho barril', items: [['Litro',6000],['Meio litro',3000],['Taça',1500]] },
                { title: 'Champanhe', items: [['Moscato',22000],['Dom Luciano',18000],['Laço Vermelho',15000]] },
                { title: 'Cafés', items: [['Café Vita',5000],['Café Cheirinho',2000],['Caffè normal',1200]] },
                { title: 'Chás', items: [['Chá carioca',1000],['Chá verde',1000],['Chá frutos vermelhos',1000]] }
            ]
        };

        function escapeMenuText(value) {
            return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[char]));
        }
        function formatMenuPrice(value) {
            return `Kz ${String(value).replace(/\B(?=(\d{3})+(?!\d))/g, '.')}`;
        }
        function renderMenu(targetId, categories) {
            document.getElementById(targetId).innerHTML = categories.map(category => `
                <div class="menu-section">
                    <h2 class="section-title">${escapeMenuText(category.title)}</h2>
                    ${category.items.map(([name, price, note]) => `
                        <div class="menu-item">
                            <div class="item-header">
                                <span class="item-name">${escapeMenuText(name)}</span>
                                <div class="item-dots" aria-hidden="true"></div>
                                <span class="item-price">${formatMenuPrice(price)}</span>
                            </div>
                            ${note ? `<p class="item-desc">${escapeMenuText(note)}</p>` : ''}
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }
        renderMenu('menu-comidas', currentMenu.comidas);
        renderMenu('menu-bebidas', currentMenu.bebidas);
        const heroSection = document.getElementById('hero');
        const appContent = document.getElementById('app-content');
        const viewComidas = document.getElementById('view-comidas');
        const viewBebidas = document.getElementById('view-bebidas');
        const tabComidas = document.getElementById('tab-comidas');
        const tabBebidas = document.getElementById('tab-bebidas');

        function openApp(type) {
            heroSection.classList.add('hidden');
            appContent.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            switchTab(type);
        }

        function goHome() {
            appContent.classList.add('hidden');
            heroSection.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchTab(type) {
            const isComidas = type === 'comidas';
            viewComidas.classList.toggle('hidden', !isComidas);
            viewBebidas.classList.toggle('hidden', isComidas);
            tabComidas.classList.toggle('active', isComidas);
            tabBebidas.classList.toggle('active', !isComidas);
            const activeView = isComidas ? viewComidas : viewBebidas;
            activeView.classList.remove('fade-in');
            void activeView.offsetWidth;
            activeView.classList.add('fade-in');
        }
    </script>
</body>
</html>
