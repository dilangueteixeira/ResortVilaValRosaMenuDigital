<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Val Rosa Resort | Cardápio</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para Ícones Line-Art -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================================
           VILA ROSA RESORT - DESIGN SYSTEM
           ========================================================= */
        :root {
            --bg-color: #050505;
            --bg-surface: #0a0a0a;
            --gold: #D4AF37;
            --gold-light: #f3e5ab;
            --orange: #E67E22;
            --text-main: #fcfcfc;
            --text-muted: #9e9e9e;
            --border-gold: rgba(212, 175, 55, 0.3);
            --font-heading: 'Gelasio', serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 600; }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-pattern {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% -20%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            z-index: -1; pointer-events: none;
        }
        .bg-pattern::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><path d="M30 5C30 5 45 15 45 30C45 45 30 55 30 55C30 55 15 45 15 30C15 15 30 5 30 5Z" fill="none" stroke="rgba(212, 175, 55, 0.03)" stroke-width="1"/></svg>');
            background-size: 150px; opacity: 0.5;
        }

        /* HERO */
        #hero {
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 2rem; position: relative;
        }
        .hero-logo { max-width: 85%; width: 320px; height: auto; margin-bottom: 1.5rem; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3)); }
        .hero-subtitle { font-size: 0.95rem; color: var(--text-muted); letter-spacing: 5px; margin-bottom: 4rem; text-transform: uppercase; font-weight: 300; }
        .hero-buttons { display: flex; flex-direction: column; gap: 1.5rem; width: 100%; max-width: 340px; }

        .btn {
            background: rgba(5, 5, 5, 0.6); backdrop-filter: blur(5px);
            border: 1px solid var(--border-gold); color: var(--gold);
            font-family: var(--font-heading); font-size: 1.1rem;
            padding: 1.2rem 2rem; cursor: pointer; transition: all 0.4s ease;
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            letter-spacing: 1px; border-radius: 2px;
        }
        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            transition: all 0.6s ease; z-index: 1;
        }
        .btn:hover { background: var(--gold); color: var(--bg-color); border-color: var(--gold); box-shadow: 0 5px 25px rgba(212, 175, 55, 0.2); }
        .btn:hover::before { left: 100%; }
        .btn i { font-size: 1.2rem; z-index: 2; }
        .btn span { z-index: 2; }

        /* NAV */
        #app-content { min-height: 100vh; padding-bottom: 120px; }
        .top-nav {
            position: sticky; top: 0;
            background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            z-index: 100; border-bottom: 1px solid var(--border-gold);
            padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
        }
        .nav-brand { cursor: pointer; display: flex; align-items: center; }
        .nav-logo { height: 40px; width: auto; filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.2)); }
        .tabs { display: flex; gap: 1.5rem; }
        .tab-btn {
            background: none; border: none; color: var(--text-muted);
            font-family: var(--font-heading); font-size: 1.05rem; cursor: pointer;
            padding: 0.5rem 0; position: relative; transition: color 0.3s ease; letter-spacing: 1px;
        }
        .tab-btn.active { color: var(--gold); }
        .tab-btn::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 0; height: 2px; background: var(--gold); transition: width 0.3s ease;
        }
        .tab-btn.active::after { width: 100%; }

        /* MENU */
        .menu-container { max-width: 900px; margin: 0 auto; padding: 3rem 1.5rem; }
        .menu-section { margin-bottom: 4rem; position: relative; }
        .section-title {
            color: var(--gold); font-size: 1.6rem; text-align: center; margin-bottom: 2.5rem;
            position: relative; text-transform: uppercase; letter-spacing: 3px;
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .section-title::before, .section-title::after {
            content: ''; height: 1px; width: 50px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.6;
        }
        .menu-item { margin-bottom: 1.8rem; break-inside: avoid; }
        .item-header { display: flex; align-items: baseline; width: 100%; margin-bottom: 0.4rem; }
        .item-name { font-family: var(--font-heading); font-size: 1.15rem; color: var(--text-main); letter-spacing: 0.5px; white-space: nowrap; }
        .item-dots { flex-grow: 1; border-bottom: 2px dotted rgba(212, 175, 55, 0.25); margin: 0 12px; position: relative; top: -4px; }
        .item-price { font-family: var(--font-body); font-size: 1.1rem; color: var(--gold); font-weight: 500; white-space: nowrap; letter-spacing: 0.5px; }
        .item-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; max-width: 85%; font-weight: 300; }

        /* FAB */
        .fab {
            position: fixed; bottom: 30px; right: 30px;
            background: var(--bg-surface); border: 1px solid var(--border-gold); color: var(--gold);
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000; text-decoration: none;
        }
        .fab::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%; border: 1px solid var(--gold); opacity: 0; transition: opacity 0.3s ease;
        }
        .fab:hover { background: var(--gold); color: var(--bg-color); transform: translateY(-5px); box-shadow: 0 8px 30px rgba(212, 175, 55, 0.25); }
        .fab:hover::before { opacity: 1; transform: scale(1.1); }
        .fab-text {
            position: absolute; right: 75px;
            background: rgba(10, 10, 10, 0.95); color: var(--gold);
            padding: 10px 18px; border-radius: 4px; border: 1px solid var(--border-gold);
            font-size: 0.9rem; white-space: nowrap; opacity: 0; pointer-events: none;
            transition: all 0.3s ease; font-family: var(--font-heading); letter-spacing: 1px;
            transform: translateX(10px); backdrop-filter: blur(5px);
        }
        .fab:hover .fab-text { opacity: 1; transform: translateX(0); }

        /* RESPONSIVE */
        @media (min-width: 768px) {
            .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 4rem; }
            .section-title { grid-column: 1 / -1; }
            .hero-logo { width: 450px; }
            .hero-subtitle { font-size: 1.1rem; }
        }
        @media (max-width: 480px) {
            .hero-logo { width: 260px; }
            .item-name { font-size: 1.05rem; white-space: normal; }
            .item-dots { display: none; }
            .item-header { justify-content: space-between; }
            .item-price { font-size: 1rem; margin-left: 10px; }
            .fab { bottom: 20px; right: 20px; width: 55px; height: 55px; font-size: 1.5rem; }
            .section-title { font-size: 1.4rem; }
            .top-nav { padding: 1rem; }
            .tabs { gap: 1rem; }
        }
        .highlight { color: var(--orange); }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <!-- HERO -->
    <section id="hero">
        <div class="fade-in">
            <img src="logo.png" alt="Vila Rosa Resort Logo" class="hero-logo">
            <p class="hero-subtitle">Menu Digital</p>
            <div class="hero-buttons">
                <button class="btn" onclick="openApp('comidas')">
                    <i class="fa-solid fa-utensils"></i> <span>Ver Menu de Comidas</span>
                </button>
                <button class="btn" onclick="openApp('bebidas')">
                    <i class="fa-solid fa-wine-glass-empty"></i> <span>Ver Carta de Bebidas</span>
                </button>
            </div>
        </div>
    </section>

    <!-- APP CONTENT -->
    <section id="app-content" class="hidden">
        
        <header class="top-nav">
            <div class="nav-brand" onclick="goHome()">
                <img src="logo.png" alt="Vila Rosa" class="nav-logo">
            </div>
            <div class="tabs">
                <button class="tab-btn active" id="tab-comidas" onclick="switchTab('comidas')">Comidas</button>
                <button class="tab-btn" id="tab-bebidas" onclick="switchTab('bebidas')">Bebidas</button>
            </div>
        </header>

        <!-- ABA: COMIDAS -->
        <div id="view-comidas" class="menu-container fade-in">
            <div class="menu-grid" id="menu-comidas"></div>
        </div>
        <!-- ABA: BEBIDAS -->
        <div id="view-bebidas" class="menu-container hidden">
            <div class="menu-grid" id="menu-bebidas"></div>
        </div>    </section>

    <!-- Botão Fixo de Contato -->
    <a href="https://wa.me/244936872009" target="_blank" class="fab">
        <span class="fab-text">Chamar Garçom</span>
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <script>

        const currentMenu = {
            comidas: [
                { title: 'Entradas', items: [
                    ['Caldo de Marisco',7000],['Pica Pau',7000],['Tiras de Carne',7000],['Choco Panado',7000],['Peixe Molho Escabeche',5000],['Dobradinha',4950],['Frango a Passarinho',4950],['Chouriço Caseiro',4950],['Sopa do Dia',2500],['Caldo Verde',2500]
                ]},
                { title: 'Menu Peixe', items: [
                    ['Caldo de peixe',5000],['Choco grelhado à moda da casa',9970,'Batata cozida, legumes salteados e vinagrete'],['Mufete na brasa',7980,'Opções de peixe: Choco, Carapau ou Bacalhau. Acompanha batata doce, mandioca, feijão de óleo de palma e vinagrete.'],['Funge de Peixe Grelhado',7650,'Opções de peixe: bacalhau, xhopa, carapau'],['Filete de Peixe',6980]
                ]},
                { title: 'Menu Carne', items: [
                    ['Grelhada mista 4 Pax',25000,'Entremeadas, arroz, feijão preto, banana e batata frita'],['Picanha na brasa',14600,'Arroz, couve mineira, feijão preto e farofa'],['Frango no churrasco',8960,'Arroz, batata frita, couve mineira, feijão preto, farofa e banana frita'],['Entremeadas na brasa',8960,'Arroz, batata frita, couve mineira, feijão preto, farofa e banana frita'],['Bitoque',8000,'Arroz, batata frita, ovo estrelado e salada'],['Peito alto',7850],['Massa com todos',7500,'Misto de carnes e legumes: chispe, carne, chouriço, legumes e feijão'],['Funge de Galinha de Muamba',7500]
                ]},
                { title: 'Pizzas', items: [['Pizza de Carne Grande',9000],['Pizza de Frango Grande',8000],['Pizza de Carne Média',7000],['Pizza de Frango Média',6000]] },
                { title: 'Pratos', items: [['Prego no Prato',7000],['Bifana no Prato',6500]] },
                { title: 'Hambúrgueres', items: [['Hambúrguer de Carne',4000],['Hambúrguer de Frango',3000]] },
                { title: 'Faitas', items: [['Faita de Carne',4000],['Faita de Frango',3500]] },
                { title: 'Sobremesas', items: [['Mousse de Maracujá',3000],['Gelado',2500]] }
            ],
            bebidas: [
                { title: 'Cervejas em garrafa', items: [['Heineken',1500],['Corona',1500],['Eka',600],['Cuca',600],['Nocal',600],['Doppel',600]] },
                { title: 'Cervejas em lata', items: [['Cuca',1000],['Eka',1000],['Nocal',1000],['Heineken',1000],['Doppel',1000]] },
                { title: 'Fino', items: [['Caneção (caneca)',1800],['Tulipa',800],['Normal',600],['Lambreta',400]] },
                { title: 'Cidras em garrafa', items: [['Savana',1500],['Hunters Gold',1500],['Booster Cidra',750],['Booster Morango',750],['Booster manga e laranja',750]] },
                { title: 'Refrigerantes em lata', items: [['Água Tónica',1200],['Ginger Ale',1200],['Sumol Laranja/Ananás',1000],['Coca Cola',1000],['Sprite',1000],['Fanta',1000]] },
                { title: 'Energético', items: [['Speed',1500]] },
                { title: 'Águas', items: [['Água Grande',1000],['Água Pequena',400]] },
                { title: 'Sumos', items: [['Maracujá',3000],['Ananás',3000],['Limonada',3000],['Compal',2500],['Nutry',2500],['Sumo Palinha',500]] },
                { title: 'Whiskies', items: [['Jameson Black (garrafa)',55000],['Jameson Black (dose)',5000],['Jameson (garrafa)',35000],['Jameson (dose)',3000]] },
                { title: 'Tequila', items: [['Tequila (garrafa)',20000],['Tequila (dose)',2000]] },
                { title: 'Gins', items: [['Beefeater (garrafa)',22000],['Beefeater (dose)',3000],['Gordon (garrafa)',18000],['Gordon (dose)',3000],['Beevock (garrafa)',16000],['Beevock (dose)',2000],['Havelock (garrafa)',16000],['Havelock (dose)',2000]] },
                { title: 'Licores', items: [['Martini Rosso',20000],['Martini (dose)',2500],['Amarula (garrafa)',16000],['Amarula (dose)',2000]] },
                { title: 'Outras bebidas', items: [['Gin Gordon original/Pink',1500],['Smirnoff Preta/Branca',1500]] },
                { title: 'Cocktails', items: [['Gin Tónico',4500],['Caipirinha',3000],['Maracujá',3000]] },
                { title: 'Vinhos', items: [['Silk Space',18000],['Fazenda Velha',12000],['Valmont',1500]] },
                { title: 'Vinho barril', items: [['Litro',6000],['Meio litro',3000],['Taça',1500]] },
                { title: 'Champanhe', items: [['Moscato',22000],['Dom Luciano',18000],['Laço Vermelho',15000]] },
                { title: 'Cafés', items: [['Café Vita',5000],['Café Cheirinho',2000],['Caffè normal',1200]] },
                { title: 'Chás', items: [['Chá carioca',1000],['Chá verde',1000],['Chá frutos vermelhos',1000]] }
            ]
        };

        function escapeMenuText(value) {
            return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
        }
        function formatMenuPrice(value) {
            return `Kz ${String(value).replace(/\B(?=(\d{3})+(?!\d))/g, '.')}`;
        }
        function renderMenu(targetId, categories) {
            document.getElementById(targetId).innerHTML = categories.map(category => `
                <div class="menu-section">
                    <h2 class="section-title">${escapeMenuText(category.title)}</h2>
                    ${category.items.map(([name, price, note]) => `
                        <div class="menu-item">
                            <div class="item-header">
                                <span class="item-name">${escapeMenuText(name)}</span>
                                <div class="item-dots" aria-hidden="true"></div>
                                <span class="item-price">${formatMenuPrice(price)}</span>
                            </div>
                            ${note ? `<p class="item-desc">${escapeMenuText(note)}</p>` : ''}
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }
        renderMenu('menu-comidas', currentMenu.comidas);
        renderMenu('menu-bebidas', currentMenu.bebidas);
        const heroSection = document.getElementById('hero');
        const appContent = document.getElementById('app-content');
        const viewComidas = document.getElementById('view-comidas');
        const viewBebidas = document.getElementById('view-bebidas');
        const tabComidas = document.getElementById('tab-comidas');
        const tabBebidas = document.getElementById('tab-bebidas');

        function openApp(type) {
            heroSection.classList.add('hidden');
            appContent.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            switchTab(type);
        }

        function goHome() {
            appContent.classList.add('hidden');
            heroSection.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchTab(type) {
            if (type === 'comidas') {
                viewComidas.classList.remove('hidden');
                viewBebidas.classList.add('hidden');
                tabComidas.classList.add('active');
                tabBebidas.classList.remove('active');
            } else {
                viewBebidas.classList.remove('hidden');
                viewComidas.classList.add('hidden');
                tabBebidas.classList.add('active');
                tabComidas.classList.remove('active');
            }
            const activeView = type === 'comidas' ? viewComidas : viewBebidas;
            activeView.classList.remove('fade-in');
            void activeView.offsetWidth;
            activeView.classList.add('fade-in');
        }
    </script>
</body>
</html>
